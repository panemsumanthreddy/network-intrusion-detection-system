name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: testing
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      TEST_DATABASE_URL: postgresql+psycopg://postgres:testing@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: npm ci && npm run build
        working-directory: web
      - run: docker compose build api
      - run: docker compose up -d && docker compose wait demo
      - run: |
          python - <<'PY'
          import json, urllib.request
          health = json.load(urllib.request.urlopen('http://localhost:8000/api/health'))
          assert health['totals']['flow'] == 121
          assert health['sensor']['state'] == 'complete'
          PY
