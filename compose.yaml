x-app: &app
  build: .
  image: tracewatch:local
  environment:
    DATABASE_URL: postgresql+psycopg://tracewatch:${POSTGRES_PASSWORD:-localdemo}@db:5432/tracewatch

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: tracewatch
      POSTGRES_USER: tracewatch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdemo}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tracewatch"]
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 30
  demo:
    <<: *app
    depends_on:
      api:
        condition: service_healthy
    command: ["python", "-m", "nids.sensor", "--pcap", "demo/branch-office.pcap", "--demo", "--speed", "3"]
volumes:
  pgdata:
